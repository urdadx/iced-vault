name: Release Builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-appimage
            os: ubuntu-latest
            script: bash scripts/package-linux.sh
          - name: macos-intel
            os: macos-13
            script: bash scripts/package-macos.sh
          - name: macos-apple-silicon
            os: macos-14
            script: bash scripts/package-macos.sh
          - name: windows-exe
            os: windows-latest
            script: powershell -ExecutionPolicy Bypass -File scripts/package-windows.ps1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libxi-dev \
            libxrandr-dev \
            pkg-config

      - name: Install cargo-packager
        if: runner.os != 'Windows'
        run: cargo install cargo-packager --locked

      - name: Build release artifact
        run: ${{ matrix.script }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.dmg
            dist/*.app.zip
            dist/*.exe
