[package]
name = "iced-vault"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
chrono = "0.4"
csv = "1"
directories = "6"
iced = { version = "0.14.0", features = ["image", "svg", "tokio"] }
iced_dialog = "0.14.0"
rand_core = { version = "0.6", features = ["getrandom"] }
rfd = "0.15"
open = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[package.metadata.packager]
product-name = "Iced Vault"
identifier = "dev.urdadx.iced-vault"
description = "Local desktop password manager built with Rust and iced."
homepage = "https://github.com/urdadx/iced-vault"
category = "Utility"
icons = ["src/icons/app_icon.png"]
before-packaging-command = "cargo build --release"
out-dir = "dist"
binaries-dir = "target/release"

[package.metadata.packager.linux]
generate-desktop-entry = true

[package.metadata.packager.appimage]
bins = ["/usr/bin/xdg-open"]
