[package]
name = "iced-vault"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
chrono = "0.4"
csv = "1"
directories = "6"
iced = { version = "0.14.0", features = ["image", "svg"] }
iced_dialog = "0.14.0"
rand_core = { version = "0.6", features = ["getrandom"] }
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
